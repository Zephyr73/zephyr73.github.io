name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.gitignore'
      - 'docs/**'
      - 'media/**'
      - '.vscode/**'
      - '.agents/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Eleventy images
        uses: actions/cache@v6
        with:
          path: .cache
          key: ${{ runner.os }}-eleventy-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-eleventy-

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check
        run: |
          npm run format:check
          npm run lint:js

      - name: Validate gallery images
        run: npm run check:images

      - name: Build CSS
        run: npm run build:css

      - name: Build Eleventy site
        run: npm run build

      - name: Validate HTML & links
        run: |
          npm run test:html
          npm run test:links

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
